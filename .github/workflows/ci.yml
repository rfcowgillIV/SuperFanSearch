# Automated build check (added October 2026)
#
# Every push and pull request to master compiles the app with the current Xcode
# on a GitHub Mac, for the iPhone Simulator (no code signing needed). If it
# builds here, it builds on your Mac. Compiled with love (and Swift).
name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project "SuperFanSearch.xcodeproj" \
            -target "SchoolSearch" \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
